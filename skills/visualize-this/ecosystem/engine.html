<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root { --ink:#111; --blue:#2563eb; --green:#16a34a; --red:#dc2626; --yellow:#fde047; --muted:#6b7280; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:#fff; color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#app { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header { display:flex; align-items:center; gap:20px; padding:10px 28px 0; }
#crumb { font-size:19px; color:#444; white-space:nowrap; min-width:300px; }
#crumb a { color:var(--blue); cursor:pointer; text-decoration:underline; }
#mini { flex:1; height:58px; max-width:1100px; }
#mini .pill { cursor:pointer; }
#stagewrap { position:relative; min-height:0; }
#stage { width:100%; height:100%; display:block; }
footer { padding:4px 32px 14px; }
#title { font-size:31px; font-weight:750; margin:0; }
#text { font-size:23px; margin:6px 0 0; min-height:30px; max-width:1300px; }
#note { font-size:21px; margin:8px 0 0; background:var(--yellow); display:inline-block; padding:3px 12px; border-radius:6px; opacity:0; transition:opacity .35s; }
#note.on { opacity:1; }
#bar { display:flex; align-items:center; gap:10px; margin-top:10px; }
button { font:inherit; font-size:17px; padding:6px 16px; border:2px solid #111; background:#fff; border-radius:8px; cursor:pointer; }
button:hover { background:#f3f4f6; }
button.on { background:#111; color:#fff; }
#count { font-size:17px; color:#444; min-width:120px; text-align:right; }
.dots { display:flex; gap:5px; flex-wrap:wrap; flex:1; align-items:center; }
.dots i { width:13px; height:13px; border-radius:50%; border:2px solid #111; cursor:pointer; display:block; }
.dots i.done { background:#111; }
.dots i.cur { background:var(--blue); border-color:var(--blue); transform:scale(1.25); }
.dots i.gap { margin-left:12px; }
svg text { white-space: pre; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
.box { cursor:pointer; }
</style>
</head>

  </div>
  <footer>
    <h1 id="title"></h1>
    <div id="text"></div>

      <button id="auto">Auto</button>

  </footer>
</div>

/* ---------- actors (inside a box) ---------- */

/* ---------- scene (inside of one box) ---------- */
class Scene {
  constructor(box, spec, parent) {
    this.box = box; this.spec = spec; this.actors = {};
    const s = box.w / IW;
    this.root = el('g', { transform: `translate(${box.x},${box.y}) scale(${s})`, visibility: 'hidden', opacity: 0 }, parent);
    el('rect', { x: 0, y: 0, width: IW, height: IH, rx: 18 / s * 0.6, fill: '#fff' }, this.root);
    this.layerBg = el('g', {}, this.root);
    this.layerLinks = el('g', {}, this.root);
    this.layerActors = el('g', {}, this.root);
    this.layerFx = el('g', {}, this.root);
    this.ports = { in: [], out: null };
    this.drawLanes();
    this.drawPorts();
    for (const a of spec.actors || []) {
      const make = ACTORS[a.type];
      if (!make) throw new Error(`unknown actor type ${a.type}`);
      this.actors[a.id] = make(this, a);
    }
  }
  actor(id) { const a = this.actors[id]; if (!a) throw new Error(`no actor ${id} in ${this.box.id}`); return a; }
  drawLanes() {
    for (const L of this.spec.lanes || []) {
      const g = el('g', {}, this.layerBg);
      const r = el('rect', { x: 196, y: L.y, width: 1208, height: L.h, rx: 14, fill: '#fafafa', stroke: '#cbd5e1', 'stroke-width': 3, 'stroke-dasharray': '10 8' }, g);
      T(g, 212, L.y + 30, L.label, { size: 20, bold: true, fill: C.muted });
      L.rect = r;
    }
  }
  drawPorts() {
    const P = this.spec.ports || {};
    const port = (x, y, art, sub, dir, solid) => {
      const g = el('g', { transform: `translate(${x},${y})` }, this.layerBg);
      const w = 160, h = 96;
      const d = dir === 'in'
        ? `M0,0 L${w - 22},0 L${w},${h / 2} L${w - 22},${h} L0,${h} Z`
        : `M0,0 L${w - 22},0 L${w},${h / 2} L${w - 22},${h} L0,${h} L18,${h / 2} Z`;
      const shape = el('path', { d, fill: solid ? '#eff6ff' : '#fff', stroke: solid ? C.blue : '#9ca3af', 'stroke-width': 3, 'stroke-dasharray': solid ? '' : '8 6' }, g);
      const lines = art.split('\n');
      lines.forEach((ln, i) => T(g, dir === 'in' ? 70 : 84, h / 2 + 7 - (lines.length - 1) * 12 + i * 24, ln, { size: 20, bold: true, anchor: 'middle' }));
      T(g, w / 2, -12, sub, { size: 17, anchor: 'middle', fill: C.muted });
      return { g, shape, x, y, w, h };
    };
    (P.in || []).forEach((p) => {
      const y = (p.y !== undefined ? p.y : IH / 2) - 48;
      this.ports.in.push(port(16, y, p.art, `from ${p.from}`, 'in', true));
    });
    if (P.out) {
      const y = (P.out.y !== undefined ? P.out.y : IH / 2) - 48;
      this.ports.out = port(IW - 176, y, P.out.art, `to ${P.out.to}`, 'out', false);
    }
  }
  async setOut(state) {
    const p = this.ports.out; if (!p) return;
    const ok = state !== 'bad';
    p.shape.setAttribute('stroke-dasharray', '');
    p.shape.setAttribute('stroke', ok ? C.green : C.red);
    p.shape.setAttribute('fill', ok ? '#f0fdf4' : '#fef2f2');
    await pop(p.g);
  }
  point(ref) {
    if (ref === 'OUT') { const p = this.ports.out; return { x: p.x + 20, y: p.y + p.h / 2 }; }
    const m = /^IN(\d?)$/.exec(ref);
    if (m) { const p = this.ports.in[+(m[1] || 0)]; return { x: p.x + p.w - 10, y: p.y + p.h / 2 }; }
    const mm = /^([\w-]+)(?::(\d+))?(?:\.(\w+))?$/.exec(ref);
    if (!mm) throw new Error(`bad ref ${ref}`);
    const a = this.actor(mm[1]);
    if (mm[2] !== undefined) return a.lineAnchor(+mm[2], mm[3]);
    return a.anchor(mm[3] || 'c');
  }
}

function mid(pts) {

  for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    const l = Math.hypot(x2 - x1, y2 - y1);
    if (y1 === y2 && l > len) { len = l; best = [(x1 + x2) / 2, y1 - 14]; }
  }
  return best || [(pts[0][0] + pts[1][0]) / 2, pts[0][1] - 14];
}
function setBoxState(id, st) {

/* forest token */
function mkToken(label, color = C.blue) {
  const g = el('g', {}, F.fx);
  el('circle', { r: 14, fill: color, stroke: '#fff', 'stroke-width': 3 }, g);
  const lg = el('g', {}, g);
  const t = T(lg, 0, -30, label || '', { size: 19, bold: true, anchor: 'middle', fill: '#fff' });
  const w = label ? textW(t) + 24 : 0;
  const r = el('rect', { x: -w / 2, y: -52, width: w, height: 30, rx: 15, fill: color }, lg);
  lg.insertBefore(r, t);
  if (!label) lg.setAttribute('opacity', 0);
  return {
    g,
    at(x, y) { g.setAttribute('transform', `translate(${x},${y})`); },
    label(s) { t.textContent = s; const w2 = textW(t) + 24; r.setAttribute('x', -w2 / 2); r.setAttribute('width', w2); lg.setAttribute('opacity', s ? 1 : 0); },
  };
}
async function along(tok, pts, speed = 1.1) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  const ms = Math.max(450, total / speed);
  await tween(ms, (k) => {
    let d = k * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const f = segs[i] ? d / segs[i] : 0;
    tok.at(lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f));
  });
}
function linkBetween(a, b) { return F.links.find((l) => l.from === a && l.to === b && !l.dashed); }
async function forestHop(a, b) {
  const L = linkBetween(a, b); if (!L) return;
  const tok = mkToken(L.label ? L.label.replace('\n', ' ') : '');
  tok.at(...L.pts[0]);

  tok.g.remove();
}
async function journey(opts = {}) {
  const order = ECO.forest.order;
  for (let i = 0; i < order.length; i++) {
    const id = order[i], b = F.box[id];
    if (b.lanes) {
      const toks = b.lanes.map(() => mkToken(''));
      await Promise.all(toks.map((t, j) => along(t, [[b.x + 24, b.y + 24 + j * 30], [b.x + b.w - 24, b.y + 24 + j * 30]], 0.32)));
      toks.forEach((t) => t.g.remove());
    } else {
      await flashBox(id, opts.tick ? 250 : 350);
    }
    if (opts.tick) { setBoxState(id, 'ok'); await pop(F.box[id].g, 220); }
    if (i < order.length - 1) await forestHop(id, order[i + 1]);
  }
}

/* ---------- action runner ---------- */
let REPLAYING = false;
async function runActions(list, at) {
  const S = SCENES[at] || null;
  for (const act of list) {
    await runAction(act, S, at);
  }
}
function need(S, what) { if (!S) throw new Error(`"${what}" needs a box scene, step is at forest`); return S; }
async function runAction(act, S, at) {
  if (act.parallel) { await Promise.all(act.parallel.map((lane) => runActions(lane, at))); return; }
  if (act.show !== undefined) { const ids = [].concat(act.show); await Promise.all(ids.map((id) => fade(need(S, 'show').actor(id).g, 1, 380))); return; }
  if (act.hide !== undefined) { const ids = [].concat(act.hide); await Promise.all(ids.map((id) => fade(need(S, 'hide').actor(id).g, 0, 300))); return; }
  if (act.call) { const [id, m, ...args] = act.call; const a = need(S, 'call').actor(id); if (typeof a[m] !== 'function') throw new Error(`${id} has no method ${m}`); await a[m](...args); return; }
  if (act.move !== undefined) { await movePacket(need(S, 'move'), act); return; }
  if (act.connect) { await connect(need(S, 'connect'), act); return; }
  if (act.unconnect) { const s = need(S, 'unconnect'); await fade(s.layerLinks, 0, 250); s.layerLinks.innerHTML = ''; s.layerLinks.setAttribute('opacity', 1); return; }
  if (act.mark) { await mark(need(S, 'mark').actor(act.mark[0]), act.mark[1]); return; }
  if (act.out !== undefined) { await need(S, 'out').setOut(act.out === true ? 'ok' : act.out); return; }
  if (act.lane) { await laneFlash(need(S, 'lane'), act.lane); return; }
  if (act.note !== undefined) { if (!REPLAYING) showNote(act.note); return; }
  if (act.wait) { await wait(act.wait); return; }
  if (act.mini) { if (!REPLAYING) await miniFlash(act.mini); return; }
  if (act.journey) { await journey(act.journey); return; }
  if (act.boxesIn) { await boxesIn(); return; }
  if (act.boxState) { setBoxState(act.boxState[0], act.boxState[1]); return; }
  if (act.line) { await recapLine(act.line[0], act.line[1] || []); return; }
  throw new Error('unknown action ' + JSON.stringify(act));
}
async function boxesIn() {
  const bs = ECO.forest.order.map((id) => F.box[id]);
  bs.forEach((b) => b.g.setAttribute('opacity', 0));
  for (const b of bs) { await fade(b.g, 1, 160); }
}
async function laneFlash(S, id) {
  const L = (S.spec.lanes || []).find((l) => l.id === id); if (!L) throw new Error('no lane ' + id);
  const r = L.rect;
  r.setAttribute('stroke', C.blue); r.setAttribute('fill', '#eff6ff');

}
async function mark(a, kind) {

  const g = el('g', { class: 'mark', transform: `translate(${a.w + 4},${-4})` }, a.g);
  el('circle', { r: 24, fill: kind === 'ok' ? C.green : C.red, stroke: '#fff', 'stroke-width': 3 }, g);

}
function autoSide(p, q) { return p; }
async function movePacket(S, act) {
  const color = act.color || C.blue;
  const refs = [act.from, ...(act.via || []), act.to];
  const pts = refs.map((r) => S.point(r));
  const g = el('g', {}, S.layerFx);
  const t = T(g, 0, 8, act.move, { size: 22, bold: true, mono: true, anchor: 'middle', fill: '#fff' });
  const w = textW(t) + 30;
  const r = el('rect', { x: -w / 2, y: -21, width: w, height: 42, rx: 21, fill: color }, g);
  g.insertBefore(r, t);
  const at = (x, y) => g.setAttribute('transform', `translate(${x},${y})`);
  at(pts[0].x, pts[0].y);
  if (!INSTANT) { g.setAttribute('opacity', 0); await fade(g, 1, 150); }
  let stampG = null;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i - 1], q = pts[i];
    let L = Math.hypot(q.x - p.x, q.y - p.y);

      const stop = 0.55;
      await tween(Math.max(300, L * stop / 1.0), (k) => at(lerp(p.x, q.x, k * stop), lerp(p.y, q.y, k * stop)));

      const wall = el('g', { transform: `translate(${bx + (q.x - p.x) / L * 46},${by + (q.y - p.y) / L * 46})` }, S.layerFx);
      el('circle', { r: 22, fill: C.red }, wall); T(wall, 0, 9, '✗', { size: 26, bold: true, anchor: 'middle', fill: '#fff' });
      await tween(420, (k) => at(bx + Math.sin(k * Math.PI * 6) * 10, by));
      await fade(g, 0, 300); g.remove();
      if (!INSTANT) { await wait(400); }
      await fade(wall, 0, 300); wall.remove();
      return;
    }
    await tween(Math.max(380, L / 1.05), (k) => at(lerp(p.x, q.x, k), lerp(p.y, q.y, k)));
    if (act.stamp && act.stamp.at === i) {
      await wait(150);
      stampG = el('g', { transform: `translate(${w / 2 - 6},-30)` }, g);
      const st = T(stampG, 0, 0, act.stamp.text, { size: 18, bold: true, mono: true, fill: C.red, anchor: 'middle' });
      const sw = textW(st) + 18;
      const sr = el('rect', { x: -sw / 2, y: -20, width: sw, height: 28, rx: 5, fill: '#fff', stroke: C.red, 'stroke-width': 3, transform: 'rotate(-6)' }, stampG);
      stampG.insertBefore(sr, st);
      st.setAttribute('transform', 'rotate(-6)');
      await pop(stampG, 300);
      await wait(250);
    }

  await fade(g, 0, 250);
  g.remove();
}
async function connect(S, act) {
  const [a, b] = act.connect;
  const p = S.point(a), q = S.point(b);
  const color = act.color || C.ink;
  const mk = color === C.ink ? 'ahk' : color === C.blue ? 'ahb' : 'ahy';
  const path = el('path', { d: `M${p.x},${p.y} L${q.x},${q.y}`, fill: 'none', stroke: color, 'stroke-width': 5, 'marker-end': `url(#${mk})` }, S.layerLinks);
  const len = Math.hypot(q.x - p.x, q.y - p.y);
  path.setAttribute('stroke-dasharray', `${len} ${len}`);
  await tween(500, (k) => path.setAttribute('stroke-dashoffset', len * (1 - k)));
  path.removeAttribute('stroke-dasharray');
  if (act.label) {
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const t = T(S.layerLinks, mx + 16, my + 8, act.label, { size: 20, bold: true, italic: true, fill: color === C.ink ? '#333' : color });
    await fade(t, 1, 200);

async function recapLine(text, ids) {

  const y = (ECO.recapTop || 700) + i * 50;
  const t = T(F.recap, ECO.recapLeft || 0, y, text, { size: 30, bold: i === 0 && false });

/* ---------- interior visibility + transitions ---------- */
// Everything of the forest except the opened box fades away while inside,
// so neighbours never bleed into the zoomed view.
function others(id) {
  const list = [F.linkG, F.box[id].num, F.box[id].r];
  for (const k in F.box) if (k !== id) list.push(F.box[k].g);
  return list;
}
function showInterior(at) {
  for (const k in F.box) F.box[k].g.setAttribute('opacity', 1);
  F.linkG.setAttribute('opacity', 1);
  for (const id in SCENES) {
    const s = SCENES[id], on = id === at;
    s.root.setAttribute('visibility', on ? 'visible' : 'hidden');
    s.root.setAttribute('opacity', on ? 1 : 0);
    F.box[id].face.setAttribute('opacity', on ? 0 : 1);
    F.box[id].num.setAttribute('opacity', 1);
  }
  if (SCENES[at]) others(at).forEach((e) => e.setAttribute('opacity', 0));
}
async function zoomInto(id) {
  const s = SCENES[id];
  s.root.setAttribute('visibility', 'visible');
  const face = F.box[id].face;
  const p1 = moveCam(camFor(id), 850);
  const p0 = Promise.all(others(id).map((e) => fade(e, 0, 600)));
  await wait(450);
  await Promise.all([p0, p1, fade(s.root, 1, 400), fade(face, 0, 300)]);
}
async function zoomOut(id, to = 'forest') {
  const s = SCENES[id];
  const face = F.box[id].face;
  await Promise.all([fade(s.root, 0, 300), fade(face, 1, 300), moveCam(camFor(to), 750),
    ...others(id).map((e) => fade(e, 1, 700))]);
  s.root.setAttribute('visibility', 'hidden');
}
async function transition(a, b) {
  if (a === b) return;
  const isBox = (x) => !!SCENES[x];
  if (isBox(a)) await zoomOut(a, isBox(b) ? 'forest' : b);
  else if (!isBox(b)) { await moveCam(camFor(b), 700); return; }
  if (isBox(a) && isBox(b)) await forestHop(a, b);
  if (isBox(b)) { if (!isBox(a) && a !== 'forest') await moveCam(camFor('forest'), 500); await zoomInto(b); }
}

/* ---------- UI ---------- */
const STEPS = ECO.steps;
const $ = (id) => document.getElementById(id);
let cur = 0, auto = false, freeLook = false;

function showNote(s) { const n = $('note'); n.textContent = s; n.classList.toggle('on', !!s); }
function renderChrome(n) {
  const st = STEPS[n];
  $('title').textContent = st.title;
  $('text').textContent = st.text;
  showNote('');
  $('count').textContent = `Step ${n + 1} of ${STEPS.length}`;
  const dots = $('dots').children;
  for (let i = 0; i < dots.length; i++) { dots[i].className = (i < n ? 'done' : i === n ? 'cur' : '') + (dots[i].dataset.gap ? ' gap' : ''); }
  const crumb = $('crumb');
  crumb.innerHTML = '';
  const root = document.createElement('a'); root.textContent = 'Whole journey';
  root.onclick = () => lookForest();
  crumb.appendChild(root);
  if (SCENES[st.at]) { const b = ECO.forest.boxes.find((x) => x.id === st.at); crumb.append(` › ${b.n} · ${b.name}`); }
  renderMini(st.at);
}
function renderMini(at) {
  const m = $('mini'); m.innerHTML = '';
  const order = ECO.forest.order, n = order.length, gap = 16, w = (1000 - gap * (n - 1)) / n;
  order.forEach((id, i) => {
    const b = ECO.forest.boxes.find((x) => x.id === id);
    const x = i * (w + gap);
    const g = el('g', { class: 'pill', 'data-id': id }, m);
    el('rect', { x, y: 8, width: w, height: 42, rx: 10, fill: id === at ? C.yellow : '#fff', stroke: C.ink, 'stroke-width': id === at ? 3 : 1.6 }, g);
    if (b.lanes) b.lanes.forEach((_, j) => el('line', { x1: x + 8, y1: 16 + j * 6, x2: x + w - 8, y2: 16 + j * 6, stroke: '#94a3b8', 'stroke-width': 2 }, g));
    T(g, x + w / 2, 42, `${b.n} ${b.short || b.name}`, { size: 15, anchor: 'middle', bold: id === at });
    if (i < n - 1) el('path', { d: `M${x + w + 2},29 L${x + w + gap - 3},29`, stroke: '#9ca3af', 'stroke-width': 2.5, 'marker-end': 'url(#ah)' }, m);

async function miniFlash(id) {
  const g = $('mini').querySelector(`[data-id="${id}"] rect`); if (!g) return;
  for (let i = 0; i < 3; i++) { g.setAttribute('fill', C.blue); await wait(180); g.setAttribute('fill', '#fff'); await wait(140); }
}
function buildDots() {
  const d = $('dots'); d.innerHTML = '';
  STEPS.forEach((s, i) => {
    const e = document.createElement('i');
    e.title = `${i + 1}. ${s.title}`;

}
async function go(n, animate = true) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  GEN++; const my = GEN;
  freeLook = false;
  cur = n;
  buildWorld();
  INSTANT = true; REPLAYING = true;
  for (let i = 0; i < n; i++) { await runActions(STEPS[i].actions, STEPS[i].at); if (my !== GEN) return; }
  REPLAYING = false;
  const prev = n > 0 ? STEPS[n - 1].at : 'forest';
  renderChrome(n);
  if (!animate) {
    await runActions(STEPS[n].actions, STEPS[n].at);
    showInterior(STEPS[n].at); setCam(camFor(STEPS[n].at));
    INSTANT = false;
    if (STEPS[n].note) showNote(STEPS[n].note);
    return;
  }
  showInterior(prev); setCam(camFor(prev));
  INSTANT = false;
  try {
    await transition(prev, STEPS[n].at);
    if (my !== GEN) return;
    showInterior(STEPS[n].at);
    await runActions(STEPS[n].actions, STEPS[n].at);
  } catch (e) { console.error(e); throw e; }
  if (my !== GEN) return;
  if (STEPS[n].note) showNote(STEPS[n].note);
  if (auto && n < STEPS.length - 1) { await wait(1600); if (my === GEN && auto) go(n + 1, true); }
}
function jumpToBox(id) { const i = STEPS.findIndex((s) => s.at === id); if (i >= 0) go(i, true); }
async function lookForest() {
  const at = STEPS[cur].at;
  if (!SCENES[at]) return;
  GEN++; freeLook = true;
  INSTANT = false;
  await zoomOut(at);
  $('title').textContent = 'The whole journey';
  $('text').textContent = 'Click any box to open it, or press Next to continue where you were.';
  showNote('');
  renderMini(null);
}
$('next').onclick = () => go(freeLook ? cur : cur + 1, true);
$('back').onclick = () => go(cur - 1, false);
$('replay').onclick = () => go(cur, true);
$('auto').onclick = () => { auto = !auto; $('auto').classList.toggle('on', auto); if (auto) go(cur + 1, true); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') $('back').click();
  else if (e.key === 'r') $('replay').click();
  else if (e.key === 'Escape') lookForest();
});
buildDots();
window.__deck = { go, STEPS, get cur() { return cur; }, get SCENES() { return SCENES; }, get F() { return F; } };
go(0, true);
</script>
</body>
