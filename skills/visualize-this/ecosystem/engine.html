<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<style>
/*FONTS*/
:root {
  --paper:#F6F8FB; --card:#FFFFFF; --ink:#0F172A; --ink2:#1E293B; --body:#334155; --muted:#64748B; --faint:#94A3B8;
  --line:#D5DCE6; --soft:#EEF2F7; --blue:#2563EB; --green:#059669; --red:#E11D48; --hl:#FFE58A;
  --sans: Manrope, "Inter", "Adwaita Sans", "Noto Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
#app { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header { display:grid; grid-template-columns:minmax(260px,auto) 1fr; align-items:center; gap:32px; padding:14px 32px 4px; }
#deck { font-weight:700; font-size:16px; letter-spacing:-0.01em; }
#crumb { font-size:14px; color:var(--muted); margin-top:3px; white-space:nowrap; }
#crumb a { color:var(--blue); cursor:pointer; text-decoration:none; font-weight:600; }
#crumb a:hover { text-decoration:underline; }
#mini { width:100%; height:56px; }
#mini .node { cursor:pointer; }
#stagewrap { position:relative; min-height:0; }
#stage { width:100%; height:100%; display:block; }
#stage .box { cursor:pointer; }
#stage .box:hover .frame { stroke:var(--ink); }
svg text { white-space:pre; }
#stage, #mini { font-family:var(--sans); }
footer { padding:6px 40px 18px; }
#eyebrow { font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
#title { font-size:30px; font-weight:800; letter-spacing:-0.02em; margin:4px 0 0; }
#text { font-size:20px; line-height:1.4; color:var(--body); margin:6px 0 0; max-width:1250px; min-height:28px; }
#note { display:inline-block; margin-top:10px; font-size:17px; font-weight:600; color:#3F3200; background:#FFF6CC; border-left:4px solid #FACC15; border-radius:8px; padding:5px 14px; opacity:0; transform:translateY(4px); transition:opacity .35s, transform .35s; }
#note.on { opacity:1; transform:none; }
#bar { display:flex; align-items:center; gap:10px; margin-top:14px; }
button { font:inherit; font-size:15px; font-weight:600; height:38px; padding:0 16px; border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; cursor:pointer; }
button:hover { border-color:var(--ink); }
button:focus-visible { outline:3px solid #93C5FD; outline-offset:2px; }
button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
button.on { background:#EEF4FF; border-color:var(--blue); color:var(--blue); }
.prog { display:flex; align-items:center; gap:3px; flex:1; margin:0 10px; }
.prog i { flex:1 1 0; height:6px; border-radius:3px; background:#E2E8F0; cursor:pointer; transition:background .2s; }
.prog i:hover { background:var(--faint); }
.prog i.done { background:#94A3B8; }
.prog i.cur { background:var(--blue); height:8px; }
.prog i.gap { margin-left:9px; }
#count { font-family:var(--mono); font-size:13px; color:var(--muted); min-width:72px; text-align:right; }
@media (prefers-reduced-motion: reduce) { #note { transition:none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div id="deck"></div><div id="crumb"></div></div>
    <svg id="mini" viewBox="0 0 1000 56" preserveAspectRatio="xMidYMid meet"></svg>
  </header>
  <div id="stagewrap">
    <svg id="stage" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet">

        <pattern id="barrier" patternUnits="userSpaceOnUse" width="56" height="26"><rect width="56" height="26" fill="#fff"/><rect width="28" height="26" fill="#E11D48"/></pattern>
        <marker id="chev" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M2,1.5 L9.5,6 L2,10.5" fill="none" stroke="#9AA8BB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="chevk" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M2,1.5 L9.5,6 L2,10.5" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="chevy" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M2,1.5 L9.5,6 L2,10.5" fill="none" stroke="#CA8A04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="chevb" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M2,1.5 L9.5,6 L2,10.5" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="mini-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2,1.5 L9.5,6 L2,10.5" fill="none" stroke="#CBD5E1" stroke-width="2.4"/></marker>
      </defs>
      <g id="world"></g>
    </svg>
  </div>
  <footer>
    <div id="eyebrow"></div>
    <h1 id="title"></h1>
    <div id="text"></div>
    <div id="note"></div>
    <div id="bar">
      <button id="back" aria-label="Previous step">←</button>
      <button id="next" class="primary">Next →</button>
      <button id="replay">↻ Replay</button>
      <button id="auto">▶ Auto</button>
      <div class="prog" id="dots"></div>
      <div id="count"></div>
    </div>
  </footer>
</div>

const NS = 'http://www.w3.org/2000/svg';

/* ---------- time ---------- */
let GEN = 0, INSTANT = false;

  camera(S, o) {

      const bulb = a.g.querySelector('.bulb');
      await tween(140, (k) => { r.setAttribute('opacity', 0.85 * k); bulb.setAttribute('fill', '#fff'); });
      await tween(520, (k) => r.setAttribute('opacity', 0.85 * (1 - k)));

  server(S, o) {

  actor(id) { const a = this.actors[id]; if (!a) throw new Error(`no actor ${id} in ${this.box.id}`); return a; }

        ? `M14,0 L${w - 30},0 Q${w - 22},0 ${w - 17},7 L${w},${h / 2} L${w - 17},${h - 7} Q${w - 22},${h} ${w - 30},${h} L14,${h} Q0,${h} 0,${h - 14} L0,14 Q0,0 14,0 Z`

      const shape = el('path', { d, fill: solid ? C.blueSoft : '#fff', stroke: solid ? C.blueLine : '#CBD5E1', 'stroke-width': 2.5, 'stroke-dasharray': solid ? '' : '7 6', 'stroke-linejoin': 'round' }, g);
      const lines = art.split('\n');
      const tx = dir === 'in' ? 72 : 86;
      const tt = lines.map((ln, i) => T(g, tx, h / 2 + 7 - (lines.length - 1) * 11 + i * 22, ln, { size: 18, weight: 800, anchor: 'middle', fill: solid ? '#1E3A8A' : C.muted }));
      eyebrow(g, w / 2, -12, sub, { anchor: 'middle', size: 12, fill: C.faint });
      return { g, shape, tt, x, y, w, h };
    };

      const y = (p.y !== undefined ? p.y : IH / 2) - 46;
      this.ports.in.push(port(18, y, p.art, `from ${p.from}`, 'in', true));
    });

      const y = (P.out.y !== undefined ? P.out.y : IH / 2) - 46;

  }
  async setOut(state) {

    const ok = state !== 'bad';
    p.shape.setAttribute('stroke-dasharray', '');
    p.shape.setAttribute('stroke', ok ? '#6EE7B7' : '#FDA4AF');
    p.shape.setAttribute('fill', ok ? C.greenSoft : C.redSoft);
    p.tt.forEach((t) => t.setAttribute('fill', ok ? '#065F46' : '#9F1239'));
    await pop(p.g);
  }
  point(ref) {
    if (ref === 'OUT') { const p = this.ports.out; return { x: p.x + 24, y: p.y + p.h / 2 }; }
    const m = /^IN(\d?)$/.exec(ref);
    if (m) { const p = this.ports.in[+(m[1] || 0)]; return { x: p.x + p.w - 12, y: p.y + p.h / 2 }; }

    if (!mm) throw new Error(`bad ref ${ref}`);

  }
}

function mid(pts) {

  for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    const l = Math.hypot(x2 - x1, y2 - y1);

}

  if (st === 'bad') { b.badge.setAttribute('opacity', 1); b.bc.setAttribute('fill', C.red); b.bm.innerHTML = ''; cross(b.bm, b.x + b.w - 6, b.y + 6, '#fff', 3.2); b.r.setAttribute('stroke', '#FDA4AF'); }

/* forest token: the one moving thing on the map */

async function along(tok, pts, speed = 1.1) {

/* ---------- action runner ---------- */
let REPLAYING = false;

// Deck files may use plain hex colours; map them onto the palette.

  path.removeAttribute('stroke-dasharray');

/* ---------- interior visibility + transitions ---------- */

}
function showInterior(at) {
  for (const k in F.box) { F.box[k].g.setAttribute('opacity', 1); F.box[k].r.setAttribute('opacity', 1); }
  F.linkG.setAttribute('opacity', 1);
  for (const id in SCENES) {
    const s = SCENES[id], on = id === at;
    s.root.setAttribute('visibility', on ? 'visible' : 'hidden');
    s.root.setAttribute('opacity', on ? 1 : 0);
    F.box[id].face.setAttribute('opacity', on ? 0 : 1);
    F.box[id].num.setAttribute('opacity', 1);
  }
  if (SCENES[at]) others(at).forEach((e) => e.setAttribute('opacity', 0));
}
async function zoomInto(id) {
  const s = SCENES[id];
  s.root.setAttribute('visibility', 'visible');
  const face = F.box[id].face;
  const p1 = moveCam(camFor(id), 850);
  const p0 = Promise.all(others(id).map((e) => fade(e, 0, 600)));
  await wait(450);
  await Promise.all([p0, p1, fade(s.root, 1, 400), fade(face, 0, 300)]);
}
async function zoomOut(id, to = 'forest') {
  const s = SCENES[id];
  const face = F.box[id].face;
  await Promise.all([fade(s.root, 0, 300), fade(face, 1, 300), moveCam(camFor(to), 750), ...others(id).map((e) => fade(e, 1, 700))]);
  s.root.setAttribute('visibility', 'hidden');
}
async function transition(a, b) {
  if (a === b) return;
  const isBox = (x) => !!SCENES[x];
  if (isBox(a)) await zoomOut(a, isBox(b) ? 'forest' : b);
  else if (!isBox(b)) { await moveCam(camFor(b), 700); return; }
  if (isBox(a) && isBox(b)) await forestHop(a, b);
  if (isBox(b)) { if (!isBox(a) && a !== 'forest') await moveCam(camFor('forest'), 500); await zoomInto(b); }
}

/* ---------- UI ---------- */
const STEPS = ECO.steps;
const $ = (id) => document.getElementById(id);
let cur = 0, auto = false, freeLook = false;
function boxOf(id) { return ECO.forest.boxes.find((x) => x.id === id); }
function viewIsForest() { return freeLook || STEPS[cur].at === 'forest' || STEPS[cur].at === 'recap'; }
function showNote(s) { const n = $('note'); n.textContent = s; n.classList.toggle('on', !!s); }
function renderChrome(n) {
  const st = STEPS[n];
  const b = boxOf(st.at);
  $('eyebrow').textContent = b ? `${String(b.n).padStart(2, '0')} — ${b.name}` : st.at === 'recap' ? 'Recap' : 'The whole system';
  $('title').textContent = st.title;
  $('text').textContent = st.text;
  showNote('');
  $('count').textContent = `${String(n + 1).padStart(2, '0')} / ${STEPS.length}`;
  const dots = $('dots').children;
  for (let i = 0; i < dots.length; i++) dots[i].className = (i < n ? 'done' : i === n ? 'cur' : '') + (dots[i].dataset.gap ? ' gap' : '');
  const crumb = $('crumb'); crumb.innerHTML = '';
  const root = document.createElement('a'); root.textContent = 'Whole system'; root.onclick = () => lookForest();
  crumb.appendChild(root);
  if (b) crumb.append(`  ›  ${b.name}`);
  renderMini(st.at);
}
function renderMini(at) {
  const m = $('mini'); m.innerHTML = '';
  const order = ECO.forest.order, n = order.length, pad = 50, gapX = (1000 - 2 * pad) / Math.max(1, n - 1);
  const curIdx = order.indexOf(at);
  el('line', { x1: pad, y1: 16, x2: pad + gapX * (n - 1), y2: 16, stroke: '#E2E8F0', 'stroke-width': 3, 'stroke-linecap': 'round' }, m);
  if (curIdx > 0) el('line', { x1: pad, y1: 16, x2: pad + gapX * curIdx, y2: 16, stroke: '#94A3B8', 'stroke-width': 3, 'stroke-linecap': 'round' }, m);
  order.forEach((id, i) => {
    const b = boxOf(id), x = pad + i * gapX;
    const g = el('g', { class: 'node', 'data-id': id }, m);
    el('rect', { x: x - 30, y: 0, width: 60, height: 56, fill: 'transparent' }, g);
    const isCur = i === curIdx, past = curIdx >= 0 && i < curIdx;
    if (b.lanes) {
      const ring = el('rect', { x: x - 11, y: 6, width: 22, height: 20, rx: 6, fill: isCur ? C.ink : '#fff', stroke: isCur ? C.ink : past ? '#94A3B8' : '#CBD5E1', 'stroke-width': 2.5, class: 'dot' }, g);
      for (let j = 0; j < 3; j++) el('line', { x1: x - 5, y1: 11 + j * 5, x2: x + 5, y2: 11 + j * 5, stroke: isCur ? '#fff' : '#94A3B8', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, g);
    } else {
      el('circle', { cx: x, cy: 16, r: isCur ? 9 : 7, fill: isCur ? C.ink : past ? '#94A3B8' : '#fff', stroke: isCur ? '#CBD5E1' : past ? '#94A3B8' : '#CBD5E1', 'stroke-width': isCur ? 4 : 2.5, class: 'dot' }, g);
    }
    T(g, x, 46, b.short || b.name, { size: 13, weight: isCur ? 800 : 600, anchor: 'middle', fill: isCur ? C.ink : C.muted });
    g.addEventListener('click', () => jumpToBox(id));
  });
}
async function miniFlash(id) {
  const d = $('mini').querySelector(`[data-id="${id}"] .dot`); if (!d) return;
  const f = d.getAttribute('fill');
  for (let i = 0; i < 3; i++) { d.setAttribute('fill', C.blue); await wait(180); d.setAttribute('fill', f); await wait(140); }
}
function buildDots() {
  const d = $('dots'); d.innerHTML = '';
  STEPS.forEach((s, i) => {
    const e = document.createElement('i');
    e.title = `${i + 1}. ${s.title}`;
    if (i > 0 && STEPS[i - 1].at !== s.at) e.dataset.gap = '1';
    e.onclick = () => go(i, false);
    d.appendChild(e);
  });
}
async function go(n, animate = true) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  GEN++; const my = GEN;
  freeLook = false;
  cur = n;
  buildWorld();
  INSTANT = true; REPLAYING = true;
  for (let i = 0; i < n; i++) { await runActions(STEPS[i].actions, STEPS[i].at); if (my !== GEN) return; }
  REPLAYING = false;
  const prev = n > 0 ? STEPS[n - 1].at : 'forest';
  renderChrome(n);
  if (!animate) {
    await runActions(STEPS[n].actions, STEPS[n].at);
    showInterior(STEPS[n].at); setCam(camFor(STEPS[n].at));
    INSTANT = false;
    if (STEPS[n].note) showNote(STEPS[n].note);
    return;
  }
  showInterior(prev); setCam(camFor(prev));
  INSTANT = false;
  await transition(prev, STEPS[n].at);
  if (my !== GEN) return;
  showInterior(STEPS[n].at);
  await runActions(STEPS[n].actions, STEPS[n].at);
  if (my !== GEN) return;
  if (STEPS[n].note) showNote(STEPS[n].note);
  if (auto && n < STEPS.length - 1) { await wait(1600); if (my === GEN && auto) go(n + 1, true); }
}
function jumpToBox(id) { const i = STEPS.findIndex((s) => s.at === id); if (i >= 0) go(i, true); }
async function lookForest() {
  const at = STEPS[cur].at;
  if (!SCENES[at]) return;
  GEN++; freeLook = true; INSTANT = false;
  await zoomOut(at);
  $('eyebrow').textContent = 'The whole system';
  $('title').textContent = 'Pick a box';
  $('text').textContent = 'Click any box to open it, or press Next to continue where you were.';
  showNote('');
  renderMini(null);
}
$('deck').textContent = ECO.title;
$('next').onclick = () => go(freeLook ? cur : cur + 1, true);
$('back').onclick = () => go(cur - 1, false);
$('replay').onclick = () => go(cur, true);
$('auto').onclick = () => { auto = !auto; $('auto').classList.toggle('on', auto); if (auto) go(cur + 1, true); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') $('back').click();
  else if (e.key === 'r') $('replay').click();
  else if (e.key === 'Escape') lookForest();
});
buildDots();
// Measure text only after the embedded fonts are in, so every box fits its words.
Promise.all([document.fonts.load('700 20px Manrope'), document.fonts.load('600 18px "JetBrains Mono"')]).catch(() => {}).then(() => {
  window.__deck = { go, STEPS, get cur() { return cur; }, get SCENES() { return SCENES; }, get F() { return F; } };
  go(0, true);
});
</script>
